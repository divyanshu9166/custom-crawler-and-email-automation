[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "outreach-workbench"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "httpx>=0.28,<1",
  "beautifulsoup4>=4.13,<5", "pydantic-settings>=2.8,<3",
  "email-validator>=2.2,<3", "dnspython>=2.9,<3", "tzdata>=2025.1", "playwright>=1.63,<2", "psutil>=7,<8"
]

[project.optional-dependencies]
test = ["pytest>=8,<10", "pytest-asyncio>=0.25,<2", "ruff>=0.11,<1", "pyyaml>=6,<7", "cryptography>=44,<52"]
browser = ["playwright>=1.63,<2"]

[tool.setuptools.packages.find]
include = ["outreach*"]

[tool.setuptools.package-data]
outreach = ["static/*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 110

 [tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
